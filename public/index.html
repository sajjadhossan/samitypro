<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <title>SamityPro Mobile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hind Siliguri", sans-serif;
      overflow-x: hidden !important;
      max-width: 100vw !important;
      width: 100% !important;
      touch-action: pan-y;
      overscroll-behavior-x: none;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 20px;
      text-align: center;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(51, 65, 85, 0.6);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(16, 185, 129, 0.15);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
      font-size: 11px;
      font-weight: 700;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    p.status-text {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .input-group {
      text-align: left;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    input[type="url"], input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 12px;
      color: #ffffff;
      font-size: 13px;
      font-family: monospace;
      outline: none;
      transition: border 0.2s;
    }
    input[type="url"]:focus, input[type="text"]:focus {
      border-color: #10b981;
    }
    .btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 10px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-secondary:active { background: #334155; }
    .quick-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #1e293b;
    }
    .quick-btn {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 10px;
      color: #94a3b8;
      font-size: 11px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .quick-btn:hover { color: #f1f5f9; border-color: #10b981; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <div id="loader-section">
      <div class="spinner"></div>
      <span class="badge">অফিশিয়াল মোবাইল অ্যাপ v1.0.7</span>
      <h1>সমিতিপ্রো (SamityPro)</h1>
      <p id="loading-msg" class="status-text">সার্ভারের সাথে সংযোগ স্থাপন করা হচ্ছে...</p>
    </div>

    <!-- Manual Configuration Section (Shown automatically if server is not reachable within 2.5s) -->
    <div id="config-section" class="hidden">
      <span class="badge" style="background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.3); color: #f59e0b;">
        সংযোগ কনফিগারেশন
      </span>
      <h1>সার্ভার কানেকশন</h1>
      <p class="status-text">
        ক্লাউড সার্ভার বা লোকাল কম্পিউটার (Wi-Fi) সার্ভারের ঠিকানা নির্বাচন বা প্রদান করুন:
      </p>

      <div class="input-group">
        <label for="server-url">সার্ভার URL / IP ঠিকানা</label>
        <input type="url" id="server-url" placeholder="https://samitypro.vercel.app" />
      </div>

      <button id="btn-connect" class="btn btn-primary" onclick="connectToServer()">
        সংযুক্ত করুন ও প্রবেশ করুন
      </button>

      <button id="btn-retry" class="btn btn-secondary" onclick="autoDetectServer()">
        স্বয়ংক্রিয়ভাবে পুনরায় চেষ্টা করুন
      </button>

      <div class="quick-links">
        <span style="font-size: 10px; color: #64748b; text-transform: uppercase; font-weight: 700;">দ্রুত নির্বাচন করুন:</span>
        <button class="quick-btn" onclick="setQuickUrl('https://samitypro.vercel.app')">
          <span>🌐 Vercel ক্লাউড সার্ভার</span>
          <strong style="color: #38bdf8;">samitypro.vercel.app</strong>
        </button>
        <button class="quick-btn" onclick="setQuickUrl('http://192.168.1.3:3000')">
          <span>💻 লোকাল ওয়াইফাই (Wi-Fi IP)</span>
          <strong style="color: #10b981;">192.168.1.3:3000</strong>
        </button>
        <button class="quick-btn" onclick="setQuickUrl('http://localhost:3000')">
          <span>📱 লোকালহোস্ট (Localhost)</span>
          <strong style="color: #a78bfa;">localhost:3000</strong>
        </button>
      </div>
    </div>
  </div>

  <script>
    const CLOUD_URL = 'https://samitypro.vercel.app';
    const DEFAULT_LOCAL = 'http://192.168.1.3:3000';
    const DEFAULT_LOCALHOST = 'http://localhost:3000';

    let isRedirecting = false;

    function checkServerHealth(url, timeoutMs = 2500) {
      return new Promise((resolve) => {
        let isDone = false;
        const done = (val) => {
          if (!isDone) {
            isDone = true;
            clearTimeout(timer);
            resolve(val);
          }
        };

        const timer = setTimeout(() => {
          done(false);
        }, timeoutMs);

        // Attempt 1: Fetch API endpoint with CORS
        fetch(url + '/api/tenants', { method: 'GET', cache: 'no-store' })
          .then((res) => {
            if (res.ok && res.status >= 200 && res.status < 400) {
              done(true);
            } else {
              done(false);
            }
          })
          .catch(() => {
            // Attempt 2: Image probe on favicon (CORS-immune test for 200 OK)
            const img = new Image();
            img.onload = () => done(true);
            img.onerror = () => done(false);
            img.src = url + '/favicon.ico?_r=' + Math.random();
          });
      });
    }

    async function autoDetectServer() {
      document.getElementById('loader-section').classList.remove('hidden');
      document.getElementById('config-section').classList.add('hidden');
      document.getElementById('loading-msg').textContent = 'সার্ভার অনুসন্ধান করা হচ্ছে...';

      const savedUrl = localStorage.getItem('samitypro_server_url');
      const candidates = [];
      if (savedUrl) candidates.push(savedUrl);
      candidates.push(CLOUD_URL); // Primary: Live Cloud Vercel Server
      candidates.push(DEFAULT_LOCAL);
      candidates.push(DEFAULT_LOCALHOST);

      for (const url of candidates) {
        document.getElementById('loading-msg').textContent = url + ' যাচাই করা হচ্ছে...';
        const isUp = await checkServerHealth(url, 2000);
        if (isUp) {
          redirectTo(url);
          return;
        }
      }

      // If all candidates failed after check
      showConfigScreen(savedUrl || DEFAULT_LOCAL);
    }

    function redirectTo(url) {
      if (isRedirecting) return;
      isRedirecting = true;
      localStorage.setItem('samitypro_server_url', url);
      document.getElementById('loading-msg').textContent = 'সফল সংযোগ! অ্যাপ লোড হচ্ছে...';
      window.location.replace(url);
    }

    function showConfigScreen(defaultUrl) {
      document.getElementById('loader-section').classList.add('hidden');
      document.getElementById('config-section').classList.remove('hidden');
      const input = document.getElementById('server-url');
      input.value = defaultUrl;
    }

    function setQuickUrl(url) {
      document.getElementById('server-url').value = url;
      connectToServer();
    }

    async function connectToServer() {
      let url = document.getElementById('server-url').value.trim();
      if (!url) return alert('অনুগ্রহ করে সঠিক সার্ভার URL প্রদান করুন।');
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'http://' + url;
      }

      document.getElementById('btn-connect').textContent = 'যাচাই করা হচ্ছে...';
      document.getElementById('btn-connect').disabled = true;

      const ok = await checkServerHealth(url, 3000);
      document.getElementById('btn-connect').textContent = 'সংযুক্ত করুন ও প্রবেশ করুন';
      document.getElementById('btn-connect').disabled = false;

      if (ok) {
        redirectTo(url);
      } else {
        alert('সার্ভারে সংযোগ করা যায়নি (' + url + ')। নিশ্চিত করুন সার্ভারটি চালু আছে এবং মোবাইল একই ওয়াইফাই নেটওয়ার্কে যুক্ত রয়েছে।');
      }
    }

    // Run auto-detection on launch
    autoDetectServer();
  </script>
</body>
</html>

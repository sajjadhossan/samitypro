<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <title>SamityPro Mobile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    body {
      background-color: #0b1120;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(16, 185, 129, 0.2);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2 style="color: #10b981; margin: 0 0 8px 0; font-size: 22px;">সমিতিপ্রো (SamityPro)</h2>
  <p style="color: #94a3b8; font-size: 13px; margin: 0;">মোবাইল ক্লাউড সংযোগ স্থাপন করা হচ্ছে...</p>
</body>
</html>
